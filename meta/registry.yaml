  # === 9. Billing & Claims (Phase 2) =======================================
  - path: billing/understanding-rtm-billing.md
    section: billing
    audience: clinic-staff
    status: stale
    note: "BillingSuggestion gained a source field (system vs. manual); manual claims excluded from auto-regeneration sweep and never overwritten by the system — document the manual claim concept (PR #514); PRs #534/#538 introduced claim grouping: 98980+98981 lines are now one BillingClaim record submitted together — document what 'one row per claim' means and how claim totals work. PR #785 (patient-month treatment billing): treatment-management codes 98979/98980/98981 now bill PER PATIENT PER CALENDAR MONTH, aggregating qualifying minutes + interactive contacts across ALL of a patient's episodes that month (including paused/discharged/closed ones) into ONE claim attached to a single 'anchor' episode — was previously measured per-episode. The anchor is the most-recently-enrolled episode with qualifying activity that month, unless a protected row (billed/exported/rejected/note-signed/DrChrono-linked/manual) already pins the month to its episode. Consequence to document for billing staff: a patient with multiple concurrent episodes gets ONE monthly treatment-management claim, not one per episode; duplicate system suggestions on non-anchor episodes are auto-removed. Device-supply codes 98977/98985 remain per-episode per 30-day window (unchanged). Sources widened to the suggestion engines so future changes flag here. Verify all wording against origin/main."
    priority: 1
    sources:
      - app/Models/BillingSuggestion.php
      - app/Models/BillingClaim.php
      - app/Models/Window.php
      - app/Services/RtmCounterService.php
      - app/Services/EpisodeWindowService.php
