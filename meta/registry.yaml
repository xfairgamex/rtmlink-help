# -----------------------------------------------------------------------------
# SCREENSHOTS
# -----------------------------------------------------------------------------
# The harness (php artisan help:screenshots) iterates this map: log into the
# DEMO tenant as `role`, visit `url`, wait for `wait_for` text, write `output`.
# Optional per-entry fields for trickier screens:
#   selector: <css>      crop to one element instead of full-page
#   highlight: <sel|[…]> ring control(s) before the shot; pair with selector
#   steps: [<click>...]  click-navigate to a record/tab the URL can't address
#   auth: false          skip login for a token/magic-link page (e.g. /s/{token}/…)
# Full schema + capture workflow + demo-data seeding → meta/SCREENSHOTS.md.
# Keep this list SHORT — high-value, stable, demo-safe screens only.
# -----------------------------------------------------------------------------
screenshots:
  dashboard-overview:
    role: clinic_owner
    url: https://demo.rtmlink.com/
    wait_for: "Needs Attention"
    output: .gitbook/assets/getting-started/dashboard-overview.png

  patient-list:
    role: staff
    url: https://demo.rtmlink.com/patients
    wait_for: "Patients"
    output: .gitbook/assets/patients/patient-list.png

  episode-list:
    role: provider
    url: https://demo.rtmlink.com/episodes
    wait_for: "Episodes"
    output: .gitbook/assets/episodes/episode-list.png

  episode-detail-overview:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
    wait_for: "This Calendar Month"
    output: .gitbook/assets/episodes/episode-detail-overview.png

  survey-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/surveys
    wait_for: "Surveys"
    output: .gitbook/assets/check-ins/survey-list.png

  # --- Phase 2 (Exercises / HEP) ---
  # selector/steps values are best-guesses tuned during local capture.

  exercise-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/exercises
    wait_for: "Exercises"
    output: .gitbook/assets/exercises/exercise-list.png

  episode-exercises-tab:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
      - 'button:has-text("Exercises")'
    wait_for: "Assign Exercise"
    output: .gitbook/assets/exercises/episode-exercises-tab.png

  exercise-adherence:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
    wait_for: "7-Day Adherence"
    output: .gitbook/assets/exercises/exercise-adherence.png

  patient-walkthrough:
    role: provider
    auth: false
    url: https://demo.rtmlink.com/s/demohep1/exercises
    wait_for: "View All"
    output: .gitbook/assets/exercises/patient-walkthrough.png

  # --- Billing (clinical notes) & Time Tracking (interactive contacts) ---
  # clinic_owner role: billing note actions need billing.approve, and the
  # seeded screenshot provider is not the assigned provider on demo episodes.

  billing-claims-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/billing-suggestions
    wait_for: "Clinical Note"
    output: .gitbook/assets/billing/billing-claims-list.png

  # URL pins [DEMO] Robert Williams' 98980 treatment claim; re-pin after a
  # demo reseed. Header "Clinical Note" button opens the modal (same-page).
  clinical-note-modal:
    role: clinic_owner
    url: https://demo.rtmlink.com/billing-suggestions/019e7545-b4ae-708f-8f67-de3422a76e2e
    steps:
      - 'button:text-is("Clinical Note")'
    wait_for: "Add or update the claim clinical note."
    selector: '.fi-modal-window:visible'
    output: .gitbook/assets/billing/clinical-note-modal.png

  # Direct episode URLs: click-navigation into an episode times out in the
  # harness (regression since the June captures — affects the exercise specs
  # too). URL pins [DEMO] Robert Williams' episode; re-pin after a demo reseed.
  episode-time-tracking-card:
    role: clinic_owner
    url: https://demo.rtmlink.com/episodes/019e7545-b2fb-702f-8975-7b4f02e943fc
    wait_for: "Start Timer"
    selector: 'section.fi-section:has-text("Time Tracking & Interactions")'
    output: .gitbook/assets/episodes/episode-time-tracking-card.png

  log-time-entry-modal:
    role: clinic_owner
    url: https://demo.rtmlink.com/episodes/019e7545-b2fb-702f-8975-7b4f02e943fc
    steps:
      - 'button:text-is("Add")'
      - 'label:has-text("Log interactive contact")'
    wait_for: "Log Time Entry"
    selector: '[id^="time-entry-modal-"] .fi-modal-window'
    output: .gitbook/assets/episodes/log-time-entry-modal.png

  # --- Billing batch 1 ---
  billing-claim-detail:
    role: clinic_owner
    url: https://demo.rtmlink.com/billing-suggestions/019e7545-b4ae-708f-8f67-de3422a76e2e
    wait_for: "Qualification Criteria"
    output: .gitbook/assets/billing/billing-claim-detail.png

  episode-window-card:
    role: clinic_owner
    url: https://demo.rtmlink.com/episodes/019e7545-b2fb-702f-8975-7b4f02e943fc
    wait_for: "Interaction days are unique dates"
    selector: 'section.fi-section:has-text("30-Day Window")'
    output: .gitbook/assets/billing/episode-window-card.png

  episode-month-card:
    role: clinic_owner
    url: https://demo.rtmlink.com/episodes/019e7545-b2fb-702f-8975-7b4f02e943fc
    wait_for: "minutes logged"
    selector: 'section.fi-section:has-text("This Calendar Month")'
    output: .gitbook/assets/billing/episode-month-card.png

  reimbursement-rates:
    role: clinic_owner
    url: https://demo.rtmlink.com/clinic-settings
    wait_for: "Reimbursement Rates"
    # "Reimbursement Rates" alone double-matches: the RTM Billing card's
    # description also says "reimbursement rates" (has-text is case-blind).
    selector: 'section.fi-section:has-text("Leave blank to use national averages")'
    output: .gitbook/assets/billing/reimbursement-rates.png

  # --- Check-Ins queue & review (batch 2) ---
  check-ins-queue:
    role: clinic_owner
    url: https://demo.rtmlink.com/pending-summaries
    wait_for: "Check-In Summaries"
    output: .gitbook/assets/check-ins/check-ins-queue.png

  # Review page pins the [DEMO] Provider uuid; re-pin after a demo reseed.
  review-today-patients:
    role: clinic_owner
    url: https://demo.rtmlink.com/review-summary/1a63b732-cc8c-4a77-a7ae-cdb7fca21a09
    wait_for: "Survey Summary"
    output: .gitbook/assets/check-ins/review-today-patients.png

  review-log-communication:
    role: clinic_owner
    url: https://demo.rtmlink.com/review-summary/1a63b732-cc8c-4a77-a7ae-cdb7fca21a09
    steps:
      - ':nth-match(button:has-text("No interactive comm this month"), 1)'
    wait_for: "Add Interactive Communication"
    output: .gitbook/assets/check-ins/review-log-communication.png

  staff-email-notifications:
    role: clinic_owner
    url: https://demo.rtmlink.com/clinic-settings
    wait_for: "Daily Provider Summaries"
    selector: 'section.fi-section:has-text("Every recurring email RTMLink sends your team")'
    output: .gitbook/assets/check-ins/staff-email-notifications.png

  # --- Messages & Appointments (batch 3) ---
  # Re-shoot prep: opening the thread resets the unread state. Before
  # re-capturing messages-inbox, set unread_count=1 on the [DEMO] Robert
  # Williams conversation (demo tenant) so the unread pill shows.
  messages-inbox:
    role: clinic_owner
    url: https://demo.rtmlink.com/messages
    wait_for: "New Message"
    output: .gitbook/assets/messaging/messages-inbox.png

  appointments-page:
    role: clinic_owner
    url: https://demo.rtmlink.com/appointments
    # wait_for must exist in RAW html ("Date & Time" encodes as &amp;)
    wait_for: "Follow-up knee assessment"
    output: .gitbook/assets/appointments/appointments-page.png

  # --- Settings (batch 4a) ---
  clinic-information-section:
    role: clinic_owner
    url: https://demo.rtmlink.com/clinic-settings
    wait_for: "Basic information and contact details"
    selector: 'section.fi-section:has-text("Basic information and contact details")'
    output: .gitbook/assets/settings/clinic-information-section.png

  branding-section:
    role: clinic_owner
    url: https://demo.rtmlink.com/clinic-settings
    wait_for: "Customize how your clinic appears"
    selector: 'section.fi-section:has-text("Customize how your clinic appears")'
    output: .gitbook/assets/settings/branding-section.png

  my-settings:
    role: clinic_owner
    url: https://demo.rtmlink.com/profile
    wait_for: "Current Password"
    output: .gitbook/assets/settings/my-settings.png

  # --- Team & Integrations (batch 4b) ---
  users-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/settings/users
    wait_for: "Last Login"
    output: .gitbook/assets/users/users-list.png

  # Demo tenant needs settings.ehr.system=drchrono (set demo-scoped) so the
  # Integrations nav+page appear; it shows the Disconnected connect state.
  integrations-connect:
    role: clinic_owner
    url: https://demo.rtmlink.com/integrations
    wait_for: "Connect to DrChrono"
    selector: 'section.fi-section:has-text("DrChrono EHR")'
    output: .gitbook/assets/integrations/integrations-connect.png

  # --- Front Desk & Patient Portal (batch 5) ---
  # Check-in enabled demo-scoped on the demo tenant (access_key + empty PIN) so
  # the public kiosk renders; re-pin the accessKey in the URL if it is rotated.
  checkin-kiosk:
    role: clinic_owner
    auth: false
    url: https://demo.rtmlink.com/checkin/DEMOCHECKINKEY000000000000000000
    wait_for: "Today's Check-ins"
    output: .gitbook/assets/front-desk/checkin-kiosk.png

  patient-survey:
    role: clinic_owner
    auth: false
    url: https://demo.rtmlink.com/s/demohep1
    wait_for: "Daily Check-In"
    output: .gitbook/assets/patient-portal/patient-survey.png
