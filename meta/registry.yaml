# -----------------------------------------------------------------------------
# SCREENSHOTS
# -----------------------------------------------------------------------------
# The harness (php artisan help:screenshots) iterates this map: log into the
# DEMO tenant as `role`, visit `url`, wait for `wait_for` text, write `output`.
# Optional per-entry fields for trickier screens:
#   selector: <css>      crop to one element instead of full-page
#   highlight: <sel|[…]> ring control(s) before the shot; pair with selector
#   steps: [<click>...]  click-navigate to a record/tab the URL can't address
#   auth: false          skip login for a token/magic-link page (e.g. /s/{token}/…)
# Full schema + capture workflow + demo-data seeding → meta/SCREENSHOTS.md.
# Keep this list SHORT — high-value, stable, demo-safe screens only.
# -----------------------------------------------------------------------------
screenshots:
  dashboard-overview:
    role: clinic_owner
    url: https://demo.rtmlink.com/
    wait_for: "Needs Attention"
    output: .gitbook/assets/getting-started/dashboard-overview.png

  patient-list:
    role: staff
    url: https://demo.rtmlink.com/patients
    wait_for: "Patients"
    output: .gitbook/assets/patients/patient-list.png

  episode-list:
    role: provider
    url: https://demo.rtmlink.com/episodes
    wait_for: "Episodes"
    output: .gitbook/assets/episodes/episode-list.png

  episode-detail-overview:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
    wait_for: "This Calendar Month"
    output: .gitbook/assets/episodes/episode-detail-overview.png

  survey-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/surveys
    wait_for: "Surveys"
    output: .gitbook/assets/surveys/survey-list.png

  # --- Phase 2 (Exercises / HEP) ---
  # selector/steps values are best-guesses tuned during local capture.

  exercise-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/exercises
    wait_for: "Exercises"
    output: .gitbook/assets/exercises/exercise-list.png

  episode-exercises-tab:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
      - 'button:has-text("Exercises")'
    wait_for: "Assign Exercise"
    output: .gitbook/assets/exercises/episode-exercises-tab.png

  exercise-adherence:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
    wait_for: "7-Day Adherence"
    output: .gitbook/assets/exercises/exercise-adherence.png

  patient-walkthrough:
    role: provider
    auth: false
    url: https://demo.rtmlink.com/s/demohep1/exercises
    wait_for: "View All"
    output: .gitbook/assets/exercises/patient-walkthrough.png

  # --- Billing (clinical notes) & Time Tracking (interactive contacts) ---
  # clinic_owner role: billing note actions need billing.approve, and the
  # seeded screenshot provider is not the assigned provider on demo episodes.

  billing-claims-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/billing-suggestions
    wait_for: "Clinical Note"
    output: .gitbook/assets/billing/billing-claims-list.png

  # URL pins [DEMO] Robert Williams' 98980 treatment claim; re-pin after a
  # demo reseed. Header "Clinical Note" button opens the modal (same-page).
  clinical-note-modal:
    role: clinic_owner
    url: https://demo.rtmlink.com/billing-suggestions/019e7545-b4ae-708f-8f67-de3422a76e2e
    steps:
      - 'button:text-is("Clinical Note")'
    wait_for: "Add or update the claim clinical note."
    selector: '.fi-modal-window:visible'
    output: .gitbook/assets/billing/clinical-note-modal.png

  # Direct episode URLs: click-navigation into an episode times out in the
  # harness (regression since the June captures — affects the exercise specs
  # too). URL pins [DEMO] Robert Williams' episode; re-pin after a demo reseed.
  episode-time-tracking-card:
    role: clinic_owner
    url: https://demo.rtmlink.com/episodes/019e7545-b2fb-702f-8975-7b4f02e943fc
    wait_for: "Start Timer"
    selector: 'section.fi-section:has-text("Time Tracking & Interactions")'
    output: .gitbook/assets/time-tracking/episode-time-tracking-card.png

  log-time-entry-modal:
    role: clinic_owner
    url: https://demo.rtmlink.com/episodes/019e7545-b2fb-702f-8975-7b4f02e943fc
    steps:
      - 'button:text-is("Add")'
      - 'label:has-text("Log interactive contact")'
    wait_for: "Log Time Entry"
    selector: '[id^="time-entry-modal-"] .fi-modal-window'
    output: .gitbook/assets/time-tracking/log-time-entry-modal.png
