# -----------------------------------------------------------------------------
# SCREENSHOTS
# -----------------------------------------------------------------------------
# The harness (php artisan help:screenshots) iterates this map: log into the
# DEMO tenant as `role`, visit `url`, wait for `wait_for` text, write `output`.
# Optional per-entry fields for trickier screens:
#   selector: <css>      crop to one element instead of full-page
#   highlight: <sel|[…]> ring control(s) before the shot; pair with selector
#   steps: [<click>...]  click-navigate to a record/tab the URL can't address
#   auth: false          skip login for a token/magic-link page (e.g. /s/{token}/…)
# Full schema + capture workflow + demo-data seeding → meta/SCREENSHOTS.md.
# Keep this list SHORT — high-value, stable, demo-safe screens only.
# -----------------------------------------------------------------------------
screenshots:
  dashboard-overview:
    role: clinic_owner
    url: https://demo.rtmlink.com/
    wait_for: "Needs Attention"
    output: .gitbook/assets/getting-started/dashboard-overview.png

  patient-list:
    role: staff
    url: https://demo.rtmlink.com/patients
    wait_for: "Patients"
    output: .gitbook/assets/patients/patient-list.png

  episode-list:
    role: provider
    url: https://demo.rtmlink.com/episodes
    wait_for: "Episodes"
    output: .gitbook/assets/episodes/episode-list.png

  survey-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/surveys
    wait_for: "Surveys"
    output: .gitbook/assets/surveys/survey-list.png

  # --- Phase 2 (Exercises / HEP) ---
  # selector/steps values are best-guesses tuned during local capture.

  exercise-list:
    role: clinic_owner
    url: https://demo.rtmlink.com/exercises
    wait_for: "Exercises"
    output: .gitbook/assets/exercises/exercise-list.png

  episode-exercises-tab:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
      - 'button:has-text("Exercises")'
    wait_for: "Assign Exercise"
    output: .gitbook/assets/exercises/episode-exercises-tab.png

  exercise-adherence:
    role: provider
    url: https://demo.rtmlink.com/episodes
    steps:
      - 'a:text-is("[DEMO] Marcus Chen")'
    wait_for: "7-Day Adherence"
    output: .gitbook/assets/exercises/exercise-adherence.png

  patient-walkthrough:
    role: provider
    auth: false
    url: https://demo.rtmlink.com/s/demohep1/exercises
    wait_for: "View All"
    output: .gitbook/assets/exercises/patient-walkthrough.png
