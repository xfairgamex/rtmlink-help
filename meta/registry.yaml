  - path: billing/clinical-notes.md
    section: billing
    audience: clinic-staff
    status: stale
    note: "STALE (scout 0337083..d14896f). Bundle 111 (app PR #942): the clinical-note TEMPLATE PREVIEW now actually works. On the template Edit page the 'Preview' header action now opens a 'Preview with sample data' modal that previews the currently-edited (unsaved) body -- it used to be a relabeled ViewAction that navigated to the read-only View page and so could only ever show the last-saved body. On the template View page the 'Preview with Sample Data' card now always renders: when the clinic has no claim for that CPT code it falls back to synthesized sample data (footer reads 'Preview uses data from: sample data') instead of the old 'No billing suggestion for CPT ... available' empty state. ALSO (ticket #1023, app PR #948): interactive-contact and time-entry evidence inside the rendered note is now ordered chronologically, oldest first. ALSO (Bundle 54): the provider 'claims to sign' email (ProviderClaimsToSignMail) was rebuilt on the shared branded email shell -- verify its wording/labels. UPDATE (scout f939dfb..2a0968c): (1) two NEW clinical-note template variables (ClinicalNoteTemplate::getAvailableVariables, PR #997 window): '{TIME_ENTRIES_LIST_DETAILED}' (same as {TIME_ENTRIES_LIST} but each entry's narrative note is indented beneath its line) and the per-iteration block token '{ENTRY_NOTES}' (the note captured on a time entry, empty when none) -- both let a clinic surface the justification typed at logging time in the note without hand-copying; document them in the available-variables reference. (2) Time-entry evidence DATES in the rendered note now resolve in the program/clinic timezone (ticket #1026, TimeEntry::billingDate + BillingSuggestionService snapshot) -- fixes evening entries that could print on the next calendar day / outside their own billing period; verify-only, dates should now read correctly. (3) The provider 'claims to sign' nudge email copy was reframed 'ready to sign' -> 'ready to bill' (ProviderClaimsToSignMail + provider-claims-to-sign.blade.php, PRs #995/#1002: title 'Claims Ready to Bill', eyebrow 'Ready to bill', button 'Review Claims', subject-verb agreement fix) -- fold into any email-wording mention. UPDATE (scout 2a0968c..df8fe65, app PR #1031, commit e07191b): the billable-days evidence in a rendered clinical note (and the claim-detail evidence it mirrors) now itemizes HEP/exercise interaction days, where before an exercise-only day showed only a generic type. BillingEvidenceFormatter::formatDailyEventDetail now renders an exercise day as 'Exercise logged' (one) / 'N exercises logged' (several), plus a '(feedback on M)' suffix when M of those logs carried patient-reported feeling/pain/discomfort/notes -- so an HEP-only interaction day reads as auditably as a survey day. BillingSuggestionService::buildDailyEventsEvidence supplies the new exercises_count / exercise_names / feedback_count fields. Writer: if the article shows a sample rendered note or lists the evidence lines, add the exercise-day line format; verify against BillingEvidenceFormatter at origin/main. UPDATE (scout df8fe65..8de5fb3, app PRs #1059/#1085/#1083, Bundles 102/103/141): three template-editing changes to fold into the available-variables reference and any 'editing a note template' prose. (1) Claim-aware tokens (Bundle 102): '{CLAIM_CPT_CODES}' (all CPT codes on the claim, comma-separated, e.g. '98980, 98981'; the line's own code when single-line) and '{CLAIM_TOTAL_MINUTES}' (total provider minutes for the claim month across all claim lines, so a note can state the full time backing a 98981 add-on) -- these let ONE note on a combined 98980+98981 claim name every CPT line accurately. (2) Conditional-content blocks + HEP/survey counts (Bundle 103): '{#HAS_HEP}...{/HAS_HEP}' (content renders only when the patient has an active home exercise program AND logged >=1 exercise in the period, else the whole block is removed) and '{#HAS_SURVEYS}...{/HAS_SURVEYS}' (renders only when the patient completed >=1 survey in the period), plus '{HEP_EXERCISE_COUNT}', '{HEP_COMPLETED_DAYS}', '{SURVEY_COMPLETED_DAYS}' -- so a template can guard exercise/survey language and print counts. (3) Auto-regenerate on template change (Bundle 141): saving a change to a note template's body/CPT/active state now regenerates the clinic's existing DRAFT (unsigned) notes for that CPT so they reflect the new template; both template Edit pages gained an 'Update existing draft notes' toggle (default ON, helper text stating exactly what is and is not touched -- signed notes are never rewritten) and the saved notification confirms when regeneration was queued. Writer: document the new tokens/blocks in the available-variables reference and add a short note that editing a template refreshes unsigned draft notes (with the opt-out toggle); verify labels against ClinicalNoteTemplateVariablesHelp + the ClinicalNoteTemplate Edit pages at origin/main. UPDATE (scout 8de5fb3..3280d5e, app PR #1148, commits c63f804/cdfe859): three NEW discipline note tokens to add to the available-variables reference -- '{DISCIPLINE}' (the therapy discipline spelled out for sentences: 'physical therapy' / 'occupational therapy' / 'speech-language pathology'), '{DISCIPLINE_ABBR}' (PT / OT / SLP), and '{DISCIPLINE_MODIFIER}' (the Medicare therapy modifier for the discipline's plan of care: GP for PT / GO for OT / GN for SLP). All three resolve the same way: the episode's Discipline override, else the assigned provider's discipline, else physical therapy -- so a template that adopts {DISCIPLINE} renders unchanged for a clinic that never sets one. The {DISCIPLINE_MODIFIER} deliberately matches the modifier now sent on the DrChrono claim line (see billing/exporting-to-drchrono). Writer: document the three tokens + the resolution order in the variables reference; verify against ClinicalNoteTemplate::getAvailableVariables/render + Discipline at origin/main. last_reviewed_commit stays eab6ef9."
    priority: 2
