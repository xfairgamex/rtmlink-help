# =============================================================================
# RTMLink Help Center — REGISTRY (the keystone)
# =============================================================================
# This single file ties together everything an agent needs:
#   • which articles exist            → `articles[]`
#   • where we left off               → each article's `status`
#   • what code each article derives from (for accuracy + the maintenance loop)
#                                      → each article's `sources[]` (globs)
#   • which screenshots to capture    → `screenshots{}` + each article's `screenshots[]`
#
# READ FIRST: ../AGENTS.md, meta/AUTHORING-GUIDE.md, meta/SCOPE-AND-TMI.md
#
# status:   todo | drafting | review | published | stale | blocked
#   todo      — not started
#   drafting  — being written now
#   review    — written, awaiting human PR review (set last_reviewed_commit)
#   published — merged & live on GitBook
#   stale     — app changed under this article (set by the maintenance loop)
#   blocked   — outline calls for it but the feature isn't in the code yet
#
# priority: 1 | 2 | 3 | 4   (writing phase; do lower numbers first)
#
# sources:  paths/globs RELATIVE TO THE APP ROOT (../). The maintenance loop
#           matches changed app paths against these globs to flag staleness.
#           Use directory globs (…/**) so internal file moves still match.
#
# screenshots: list of ids from the `screenshots:` map at the bottom.
#              Empty [] is normal and good — most articles need no screenshot.
# =============================================================================

meta:
  app_root: ".."
  asset_root: ".gitbook/assets"
  demo_url: "https://demo.rtmlink.com"   # demo clinic (production) — the ONLY source for screenshots; never .test, never a real clinic
  clinic_panel_path: "/"        # Filament Clinic panel is served at the subdomain root
  roles: [clinic_owner, provider, staff, billing_staff, auditor]
  # PHI: screenshots come from the DEMO tenant ONLY. Never Tula / real patients.

# -----------------------------------------------------------------------------
# ARTICLES
# -----------------------------------------------------------------------------
