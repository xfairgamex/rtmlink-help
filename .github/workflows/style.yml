name: Style

on:
  pull_request:

permissions:
  contents: read

jobs:
  article-checks:
    name: Article style + frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint changed published Markdown
        run: |
          # GITHUB_BASE_REF is the PR's target branch (main/dev), provided by GitHub as
          # a plain shell env var. No ${{ }} interpolation is used anywhere here, so no
          # untrusted PR input (title, branch name, body) can reach the shell.
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="$(git rev-parse FETCH_HEAD)"

          # Only published article Markdown that THIS PR changed; skip meta/, README, SUMMARY.
          # "Touched = clean": editing an article means leaving it fully clean, while older
          # articles nobody touched are grandfathered until they are next refreshed.
          mapfile -t files < <(
            git diff --name-only --diff-filter=d "$base...HEAD" -- \
              '*.md' ':(exclude)meta/**' ':(exclude)README.md' ':(exclude)SUMMARY.md'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No published Markdown changed in this PR."
            exit 0
          fi

          status=0
          for f in "${files[@]}"; do
            # 1. No em-dashes / en-dashes (the house voice rule; reads as machine-written).
            if grep -nP '\x{2014}|\x{2013}' "$f"; then
              echo "::error file=$f::Em-dash or en-dash found. Use a comma, parentheses, a colon, or a semicolon instead. See meta/AUTHORING-GUIDE.md."
              status=1
            fi

            # 2. Valid YAML frontmatter (GitBook parses it; an unquoted colon breaks the publish).
            if [ "$(head -n 1 "$f")" = "---" ]; then
              if ! awk 'NR==1 {next} /^---[[:space:]]*$/ {exit} {print}' "$f" \
                   | ruby -ryaml -e 'YAML.safe_load($stdin.read)' 2>/tmp/fm_err; then
                echo "::error file=$f::Invalid YAML frontmatter ($(head -n 1 /tmp/fm_err)). Quote any value that contains a colon, e.g. description: \"... RTMLink: the ...\"."
                status=1
              fi
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Published help articles must have valid YAML frontmatter and no em-dashes (U+2014) or en-dashes (U+2013)."
            echo "Quote frontmatter values containing a colon; use , ( ) : ; instead of em-dashes in prose."
            exit 1
          fi

          echo "Changed articles pass: no em-dashes, valid frontmatter."
